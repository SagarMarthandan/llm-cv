  - title: "F1 Ingestion - Formula 1 ELT Platform"
    description: "End-to-end F1 data ingestion and transformation platform on Azure using Data Factory, Databricks, and Delta Lake with Medallion Architecture."
    technologies: "Azure Data Factory, Databricks, Spark, Delta Lake, ADLS Gen2, Azure Key Vault, PySpark, Airflow"
    archetypes:
      - Data Engineering
    repo_url: "https://github.com/SagarMarthandan/F1-AzureDatabricks"
    bullets:
      - "End-to-end Formula 1 data ingestion and transformation platform on Azure — ingests Ergast F1 datasets (CSV/JSON) through Medallion Architecture (Bronze → Silver → Gold) using ADF, Databricks, and Delta Lake"
      - "Azure Data Factory orchestration: triggers Databricks notebooks with PAT/service principal credentials stored in Key Vault; parametric runs with file paths and target table names; ADF pipeline JSONs and run traces archived in snaps/"
      - "Bronze → Silver ingestion: structured schema application, type casting, null handling, partitioning; 8 entity notebooks (circuits, constructors, drivers, races, results, pit_stops, lap_times, qualifying) writing partitioned Delta tables"
      - "Silver → Gold transformations: Spark SQL joins across multiple silver tables to create denormalized presentation tables — race_results (races × drivers × results), driver_standings (championship points via window functions)"
      - "Delta Lake adoption for ACID transactions enabling safe upserts and incremental merges; migrated from Hive metastore to Delta for reliable idempotent loading"
      - "Centralized reusable helpers in common_functions.ipynb (metadata column injection, incremental merge logic, status tracking) shared across ingestion notebooks to reduce code duplication"
      - "Azure resource provisioning: Resource Group, ADLS Gen2 (raw/processed/presentation containers), Key Vault, Databricks Workspace, Data Factory — with cost management monitoring"
      - "Multiple authentication patterns explored (access key, SAS token, service principal, cluster scope); production uses service principal + Key Vault for automated pipeline security"
    keywords: [python, sql, azure data factory, databricks, spark, pyspark, delta lake, adls gen2, azure key vault, airflow, etl, elt, data pipeline, data ingestion, data transformation, medallion architecture, cloud data warehouse, orchestration, data engineering, data quality]

  - title: "Airbnb Data Engineering Project (dbt + Snowflake + Dagster)"
    description: "End-to-end dbt pipeline transforming raw Airbnb data into analytics-ready marts on Snowflake, orchestrated by Dagster with SCD Type 2 snapshots and incremental loading."
    technologies: "dbt, Snowflake, Dagster, Python, SQL"
    archetypes:
      - Data Engineering
      - Analytics Engineering
    repo_url: "https://github.com/SagarMarthandan/DBT-Airbnb-Practice-Project"
    bullets:
      - "End-to-end dbt pipeline transforming raw Airbnb data into analytics-ready marts on Snowflake, orchestrated by Dagster with asset-based scheduling and SCD Type 2 snapshots"
      - "SCD Type 2 snapshots tracking history of hosts (name, superhost status changes) and listings (price, room type, minimum stay updates) using timestamp strategy with automatic invalidation and dbt_valid_from/dbt_valid_to columns"
      - "Ephemeral staging layer (src_listings, src_hosts, src_reviews) for column renaming and field selection without creating unnecessary database objects"
      - "Core dimension models: dim_listings_cleansed (strips currency symbols, casts to NUMBER(10,2), defaults minimum_nights=0→1), dim_hosts_cleansed (NVL for missing names, Model Contracts enforcing schema integrity), dim_listings_w_hosts (LEFT JOIN with GREATEST() updated_at audit)"
      - "Incremental fact table fct_reviews: only processes new reviews since last run to reduce Snowflake compute costs; dbt_utils.generate_surrogate_key for unique hashing; idempotent date-range reload via dbt variables"
      - "Business mart mart_fullmoon_reviews: joins fct_reviews with seed_full_moon_dates to test the 'Transylvania Effect' — whether review sentiment correlates with full moons"
      - "Data quality with dbt_expectations: row count matching, regex validation on price patterns, quantile checks for outlier detection; custom positive_values test for data sanity; Model Contracts with schema-level nullability enforcement"
      - "Custom macros (no_empty_strings, select_positive_values, logging) for DRY code; audit logging via dbt hooks (on-run-start creates audit_log table, post-hook logs every model run with timestamp for performance tracking)"
    keywords: [python, sql, dbt, snowflake, dagster, etl, elt, data modeling, data warehouse, data transformation, data quality, data engineering, orchestration, incremental loading, scd type 2, data marts, cloud data warehouse, analytics]

  - title: "BTC - Bitcoin - dbt Project Documentation"
