    archetypes:
      - Data Engineering
      - Analytics Engineering
    repo_url: "https://github.com/SagarMarthandan/Youtube_E2E_DE"
    bullets:
      - "Containerized ELT pipeline extracting YouTube channel analytics via Data API v3, processing through staging and core warehouse layers with automated Soda data quality gates"
      - "3-DAG Airflow orchestration: produce_json DAG (playlist discovery, paginated video ID retrieval, batch-50 API queries for quota efficiency, timestamped JSON persistence), update_db DAG (staging upsert, core transform), data_quality DAG (Soda validation)"
      - "Smart staging synchronization: full upsert logic with drift management — automatically identifies and deletes records no longer present in source (deleted/private videos); schema enforcement before every run"
      - "Core warehouse transformations: ISO 8601 duration string parsing (PT1H2M10S → PostgreSQL TIME), video classification (Shorts ≤60s vs Normal >60s), history-preserving mirror optimized for BI tools"
