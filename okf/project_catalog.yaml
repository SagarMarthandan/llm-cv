projects:
  - title: "Chicago Crime & Divvy Bike-Share Data Engineering Pipeline"
    description: "End-to-end data pipeline (Spark, Kafka, Airflow, BigQuery, dbt, Terraform) correlating Chicago crime patterns with bike-share ridership, developed with parallel AI agents."
    technologies: "Python, Apache Spark, Apache Airflow, Apache Kafka, dbt, Google BigQuery, BigQuery ML, Terraform, GitHub Actions, Grafana, PostgreSQL, Docker, dlt, SQL"
    archetypes:
      - Data Engineering
      - Analytics Engineering
      - Backend/Platform Engineering
      - AI Engineer
    business_problem: "Correlating city crime patterns with bike-share ridership to test whether crime near stations affects usage, across 8.6M crime events and 50M+ trips with a BigQuery ML regression."
    key_metrics: "8.6M crime events + 50M+ Divvy trips; BigQuery ML R²=0.434, Pearson r=+0.20 across 1.46M station-days; 97.8% bytes saved via partition pruning; 84 dbt tests; 12-service Docker stack; 11+8 Grafana panels"
    transferable_skills: ["etl", "elt", "data warehousing", "data pipeline", "data modeling", "orchestration", "data quality", "streaming", "batch processing", "cloud data warehouse", "data architecture", "data ingestion", "data transformation", "analytics", "machine learning", "stream processing", "cloud infrastructure", "ci/cd", "observability", "geospatial analysis", "real-time data"]
    repo_url: "https://github.com/SagarMarthandan/chicago-data-pipeline"
    bullets:
      - "End-to-end data pipeline correlating Chicago crime patterns with bike-share ridership — processes 8.6M crime events and 50M+ Divvy trips across batch and streaming paths"
      - "Batch ETL path: Apache Spark (PySpark) cleans and transforms crime data from Parquet through GCS into BigQuery; dlt streams 75 monthly CSV ZIPs (~50M rows) from S3 into BigQuery with incremental append"
      - "Real-time streaming path: Kafka producer polls GBFS API every 60s into a 3-partition topic; Spark Structured Streaming consumes with exactly-once semantics via checkpointing into PostgreSQL"
      - "dbt transformation layer with 84 tests: staging models for type casting and deduplication, dimension models (date, community_area, crime_type, stations), and fact models including 1.46M station-day aggregates with geospatial ST_DISTANCE joins (≤402m quarter-mile radius)"
      - "BigQuery ML linear regression predicting ridership from crime count and temporal features — crime coefficient +1.45, in-sample R² = 0.434, overall Pearson r = +0.20 across 1.46M station-days"
      - "Infrastructure as code with Terraform provisioning GCS buckets and BigQuery datasets; partition pruning saves 97.8% bytes on filtered queries, with clustering on community_area and station_id"
      - "12-service Docker Compose stack (Postgres, Spark, Airflow, Kafka, Grafana); Airflow 3.0 orchestration with SqlSensor gating, 3 retries, 30-min timeouts, and structured JSON failure callbacks"
      - "3-workflow GitHub Actions CI/CD pipeline: PR checks (ruff, dbt parse, compose validate), dev image builds to GHCR, and prod semantic-version releases with branch protection on both dev and prod"
      - "Grafana observability: 11-panel pipeline health dashboard (row counts, trip rate, freshness, DAG status) and 8-panel crime/Divvy analysis dashboard (heatmaps, trip charts, correlation scatter, Pearson r gauge)"
      - "Built entirely through multi-agent AI workflow — AI agent as primary engineer (code generation, Docker/Terraform/dbt authoring), subagents for parallel workstreams (CI/CD, docs, dashboard migration), human providing architectural decisions and phase gates"
    keywords: [python, sql, apache spark, apache airflow, apache kafka, dbt, bigquery, bigquery ml, terraform, github actions, grafana, postgresql, docker, dlt, etl, elt, data warehousing, data pipeline, data modeling, orchestration, streaming, batch processing, cloud data warehouse, data architecture, machine learning, ci/cd, data quality, analytics, ai agents]

  - title: "NYC Taxi Analytics Pipeline (2025)"
    description: "End-to-end GCP data pipeline ingesting NYC Taxi records with Terraform, Airbyte, Airflow, BigQuery, and dbt with CI/CD and data quality checks."
    technologies: "Airbyte, Airflow, BigQuery, Docker, Terraform, Python, GitHub Actions, dbt"
    archetypes:
      - Data Engineering
      - Analytics Engineering
      - Backend/Platform Engineering
    business_problem: "Providing a governed NYC taxi trip analytics foundation on GCP with terraformed infrastructure, Airbyte ingestion, dbt star-schema marts, and quality-gated CI/CD for monthly fare, route, and demand analysis."
    key_metrics: "Monthly NYC Taxi Trip Records (2025) dataset; 4 analytics marts (monthly summary, route performance, payment breakdown, hourly demand); star schema with 3 dimension tables + fact_trips"
    transferable_skills: ["etl", "elt", "data pipeline", "data warehousing", "data modeling", "orchestration", "data quality", "cloud data warehouse", "data engineering", "python", "sql", "analytics", "infrastructure as code", "ci/cd", "star schema", "cloud data platform", "containerization"]
    repo_url: "https://github.com/SagarMarthandan/NYC-Bigquery"
    bullets:
      - "End-to-end GCP data pipeline ingesting monthly NYC Taxi trip records (2025) with Terraform-provisioned infrastructure, Airbyte replication, Airflow orchestration, and dbt transformations into BigQuery"
      - "Infrastructure as code: Terraform deploys GCS landing zones and BigQuery datasets (raw_nyc_taxi, mart_nyc_taxi) with access control rules; Makefile shortcuts for tf-init/plan/apply and dbt operations"
      - "Airbyte replication connector ingests CSV source data into GCS, auto-loaded into BigQuery raw dataset; Airflow DAG schedules monthly runs with backfill support and triggers downstream dbt transformations"
      - "dbt star schema modeling: staging layer (type casting, anomaly filtering for dates outside 2025 and negative fares), core layer (dim_location, dim_payment_type, dim_vendor, fact_trips with surrogate keys), and 4 analytics marts"
