      - "What-If scenario analysis: disconnected Price Adjustment parameter table with slicer — users simulate profit impact of price changes (e.g., +5%) without altering underlying data; adjusted revenue re-runs SUMX logic"
      - "M-Table hack: Measure Table generated via M-Language binary decompression — creates schema-only table with no data source dependencies, keeping the field list clean for housing all DAX measures"
      - "3 functional dashboard areas: Executive Summary (high-level KPIs with geographic/category breakdowns), Product Detail (performance, return rates, What-If simulations), Customer Detail (individual behavior, top spenders, order frequency)"
