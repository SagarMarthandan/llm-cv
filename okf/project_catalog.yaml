      - "Data quality: schema tests (not_null, unique, accepted_values on hour_of_day 0-23 and day_of_week) plus custom singular test assert_trip_fare_is_positive rejecting negative fares before production merge"
      - "CI/CD via GitHub Actions: SQLFluff linting and dbt test runs on every PR; containerized Airflow cluster with PostgreSQL metadata backend via Docker Compose"
      - "Modular project structure with Jinja macros (get_payment_type_description for payment code decoding), seed files (taxi_zone_lookup mapping Location IDs to boroughs), and comprehensive schema.yml documentation across all layers"
