  - title: "YouTube E2E: Advanced Data Engineering Pipeline"
    description: "Containerized ELT pipeline extracting YouTube channel analytics via Data API v3, processing through warehouse layers with Soda data quality gates."
    technologies: "Airflow, Docker, PostgreSQL, dbt, GitHub Actions, DBeaver, Soda, Redis, Python"
    archetypes:
      - Data Engineering
      - Analytics Engineering
    business_problem: "Turning YouTube channel analytics into a queryable, quality-gated warehouse with API extraction, drift-aware staging synchronization, core transformations, and Soda integrity checks on every run."
    key_metrics: "3-DAG Airflow orchestration (produce_json, update_db, data_quality); batch-50 YouTube Data API v3 queries for quota efficiency; Shorts <=60s vs Normal >60s classification"
    transferable_skills: ["etl", "elt", "data pipeline", "data warehousing", "data modeling", "orchestration", "data quality", "data engineering", "python", "sql", "analytics", "containerization", "ci/cd", "api integration", "incremental loading", "data pipeline design"]
    repo_url: "https://github.com/SagarMarthandan/Youtube_E2E_DE"
    bullets:
      - "Containerized ELT pipeline extracting YouTube channel analytics via Data API v3, processing through staging and core warehouse layers with automated Soda data quality gates"
      - "3-DAG Airflow orchestration: produce_json DAG (playlist discovery, paginated video ID retrieval, batch-50 API queries for quota efficiency, timestamped JSON persistence), update_db DAG (staging upsert, core transform), data_quality DAG (Soda validation)"
      - "Smart staging synchronization: full upsert logic with drift management — automatically identifies and deletes records no longer present in source (deleted/private videos); schema enforcement before every run"
      - "Core warehouse transformations: ISO 8601 duration string parsing (PT1H2M10S → PostgreSQL TIME), video classification (Shorts ≤60s vs Normal >60s), history-preserving mirror optimized for BI tools"
      - "Soda Core data quality layer: integrity checks (non-null, non-duplicate Video_ID), business logic validation (Likes_Count and Comments_Count cannot exceed Video_Views), independent scans on both staging and core schemas"
      - "GitHub Actions CI/CD: automated Docker image builds pushed to DockerHub on dependency changes; unit, integration, and E2E DAG test suite triggered on every push with GitHub Secrets for credential injection"
      - "Redis message broker for Airflow task queue resilience; Fernet encryption for Airflow credentials; DBeaver GUI for external query access to staging and core schemas"
      - "Docker Compose orchestration with isolated runtime environments; bind-mount dbt project at runtime to allow SQL model updates without Docker image rebuilds"
    keywords: [python, sql, airflow, docker, postgresql, dbt, github actions, soda, redis, etl, elt, data pipeline, data warehousing, data modeling, orchestration, data quality, containerization, ci/cd, analytics, data engineering]

  - title: "F1 Ingestion - Formula 1 ELT Platform"
