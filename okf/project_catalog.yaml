  - title: "COMAD PCA - Robust Principal Component Analysis"
    description: "Robust PCA implementation using Co-Median Absolute Deviation for outlier-resistant dimensionality reduction, benchmarked across multiple datasets."
    technologies: "Python, NumPy, Pandas, scikit-learn, Matplotlib, SciPy, Jupyter Notebook"
    archetypes:
      - ML Engineering
      - Data Analyst
    repo_url: "https://github.com/SagarMarthandan/PCA-using-Co-Median"
    bullets:
      - "Robust PCA implementation replacing mean-based covariance with Co-Median Absolute Deviation (COMAD) for outlier-resistant dimensionality reduction — maintains data integrity under contamination"
      - "Mathematical foundation: CoMed(X,Y) = median((X - median(X)) · (Y - median(Y))) — median-based centering and aggregation provides 50% breakdown point vs 0% for standard deviation"
      - "Complete pipeline: data ingestion → MAD calculation and standardization (k ≈ 1.4826 scaling constant) → Co-Median matrix construction → eigendecomposition → dimensionality reduction → comparative analysis"
      - "Benchmarked across 7 datasets: Iris, Wine, Glass, MNIST, Wheat, PIMA, Yeast — plus synthetic Gaussian data contaminated with outliers for controlled robustness testing"
      - "Comparative metrics: Frobenius norm reconstruction error (||X - X_reconstructed||_F / ||X||_F), pairwise distance matrix preservation, variance explained per component (Mean vs COMAD)"
      - "Downstream evaluation: classification accuracy (KNN, SVM, Random Forest) on projected features with accuracy/precision/recall/F1/ROC-AUC; clustering quality (K-Means) with silhouette scores and confusion matrices"
      - "Visualization: 2D and 3D projections of principal components via Matplotlib; distance matrix heatmaps; scree plots comparing variance explained between methods"
      - "scikit-learn integration for ML pipeline; SciPy for eigendecomposition and covariance computation; NumPy for matrix operations; Pandas for dataset loading and preprocessing"
    keywords: [python, numpy, pandas, scikit-learn, matplotlib, scipy, jupyter, machine learning, data analysis, statistical analysis, feature engineering, data science, data visualization, dimensionality reduction, outlier detection, clustering, classification]

