  - title: "Ergast Formula 1 Data Engineering Mini Project: Databricks Medallion Architecture"
    description: "Databricks Medallion Architecture pipeline ingesting Ergast F1 data through Bronze, Silver, and Gold layers with Unity Catalog governance."
    technologies: "Databricks, PySpark, SQL, Delta Lake, ADLS Gen2, Unity Catalog"
    archetypes:
      - Data Engineering
    repo_url: "https://github.com/SagarMarthandan/Databricks-Mini-Project"
    bullets:
      - "Databricks Medallion Architecture pipeline ingesting Ergast F1 data through Bronze, Silver, and Gold layers with Unity Catalog governance and ADLS Gen2 cloud storage"
      - "Bronze layer: raw JSON files from ADLS Gen2 mapped to Delta tables via External Locations in Databricks — minimal transformation, serving as landing zone with full source fidelity"
      - "Silver layer: cleansed and conformed data — CamelCase to snake_case column renaming (driverId → driver_id), name field concatenation (forename + surname = name), audit column injection (ingestion_date via current_timestamp())"
