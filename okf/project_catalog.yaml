    archetypes:
      - Data Engineering
      - Analytics Engineering
    business_problem: "Transforming raw Airbnb listings, hosts, and reviews into analytics-ready marts on Snowflake with SCD Type 2 history, incremental facts, and dbt-expectations quality checks."
    key_metrics: "SCD Type 2 snapshots (timestamp strategy, dbt_valid_from/to); incremental fct_reviews fact reducing Snowflake compute; 3 dimension models + 1 fact + full-moon review mart"
    transferable_skills: ["elt", "data modeling", "data warehouse", "data transformation", "data quality", "data engineering", "python", "sql", "orchestration", "incremental loading", "data warehousing", "scd type 2", "analytics", "business intelligence", "data marts"]
