  - title: "Adventure Works: Global Sales & Returns Dashboard"
    description: "Power BI dashboard analyzing global cycling equipment sales and returns using star schema modeling and advanced DAX time intelligence."
    technologies: "Power BI, DAX, M Language, CSV"
    archetypes:
      - Data Analyst
      - Analytics Engineering
    repo_url: "https://github.com/SagarMarthandan/powerBI---Project"
    bullets:
      - "Power BI dashboard analyzing global Adventure Works cycling equipment sales and returns across 3 continents (North America, Europe, Australia) with star schema modeling and advanced DAX time intelligence"
      - "Star schema data model: 3 fact tables (Sales Data, Returns Data) filtered by 4 dimension tables (Calendar Lookup, Product Lookup, Customer Lookup, Product Categories Lookup) with proper filter-direction relationships"
      - "Core financial DAX measures using SUMX iterators: Total Revenue (quantity × discount price via RELATED), Total Cost (quantity × product cost), Total Profit — row-by-row calculation across sales transactions"
      - "Returns analysis: Return Rate via DIVIDE (safe division-by-zero handling), Bike Returns via CALCULATE filter context override, % of All Returns using ALL() for grand total denominator"
      - "Time intelligence: Previous Month Revenue via DATEADD(-1, MONTH), 90-day rolling profit via DATESINPERIOD, 10-day rolling revenue for short-term trend detection, YTD Revenue via DATESYTD for cumulative fiscal tracking"
      - "Dynamic targets: 110% growth multiplier on previous month's revenue and orders; Target Gap analysis (Revenue/Order/Profit gaps) displayed in KPI cards and bullet charts for instant visual feedback"
      - "What-If scenario analysis: disconnected Price Adjustment parameter table with slicer — users simulate profit impact of price changes (e.g., +5%) without altering underlying data; adjusted revenue re-runs SUMX logic"
      - "M-Table hack: Measure Table generated via M-Language binary decompression — creates schema-only table with no data source dependencies, keeping the field list clean for housing all DAX measures"
      - "3 functional dashboard areas: Executive Summary (high-level KPIs with geographic/category breakdowns), Product Detail (performance, return rates, What-If simulations), Customer Detail (individual behavior, top spenders, order frequency)"
    keywords: [power bi, dax, m language, power query, csv, data visualization, dashboard, business intelligence, bi, star schema, data modeling, time intelligence, what-if analysis, return rate analysis, sales analytics, kpi tracking, reporting, business analytics, data storytelling, self-service bi, trend analysis, etl, sql]

