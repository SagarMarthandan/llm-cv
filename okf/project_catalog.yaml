    transferable_skills: ["etl", "elt", "data pipeline", "data ingestion", "data transformation", "data engineering", "python", "sql", "orchestration", "cloud data warehouse", "medallion architecture", "data lakehouse", "cloud infrastructure", "data governance", "incremental loading", "spark engineering", "data quality"]
